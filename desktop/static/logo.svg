<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0F1F3D" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>

    <!-- Book Glass Cover Gradient -->
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3A7BD5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E3C72" stop-opacity="0.95" />
    </linearGradient>

    <!-- Translucent Frosted Page Gradient Left -->
    <linearGradient id="pageLeftGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#E2F5FF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#A5E4FF" stop-opacity="0.4" />
    </linearGradient>

    <!-- Translucent Frosted Page Gradient Right -->
    <linearGradient id="pageRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#E2F5FF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#A5E4FF" stop-opacity="0.4" />
    </linearGradient>

    <!-- Neon Spine Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#00D2FF" stroke-width="4" stroke-opacity="0.35" />

  <!-- Ambient Light Halo inside Badge -->
  <circle cx="256" cy="240" r="160" fill="#00D2FF" opacity="0.12" filter="blur(40px)" />
  <circle cx="360" cy="320" r="120" fill="#3A7BD5" opacity="0.15" filter="blur(30px)" />

  <!-- The Frosted Glass Book Body -->
  <g transform="translate(0, 16)">
    <!-- Book Back Spine & Base Shadow -->
    <path d="M100,320 C160,350 220,350 256,334 C292,350 352,350 412,320 L412,342 C352,372 292,372 256,356 C220,372 160,372 100,342 Z" fill="#050B14" opacity="0.6" />

    <!-- Left Book Pages (Curved Book Opening) -->
    <path d="M256,156 C210,132 150,132 104,152 C98,154 94,160 94,166 L94,312 C94,319 99,325 106,323 C150,305 210,305 256,328 Z" fill="url(#pageLeftGrad)" />

    <!-- Right Book Pages -->
    <path d="M256,156 C302,132 362,132 408,152 C414,154 418,160 418,166 L418,312 C418,319 413,325 406,323 C362,305 302,305 256,328 Z" fill="url(#pageRightGrad)" />

    <!-- Glass Refraction Lines / Text Waves Left -->
    <path d="M136,196 C170,184 210,184 238,198" stroke="#3A7BD5" stroke-width="6" stroke-linecap="round" opacity="0.6" />
    <path d="M136,226 C170,214 210,214 238,228" stroke="#3A7BD5" stroke-width="6" stroke-linecap="round" opacity="0.6" />
    <path d="M136,256 C170,244 210,244 238,258" stroke="#3A7BD5" stroke-width="6" stroke-linecap="round" opacity="0.6" />

    <!-- Glass Refraction Lines / Text Waves Right -->
    <path d="M274,198 C302,184 342,184 376,196" stroke="#3A7BD5" stroke-width="6" stroke-linecap="round" opacity="0.6" />
    <path d="M274,228 C302,214 342,214 376,226" stroke="#3A7BD5" stroke-width="6" stroke-linecap="round" opacity="0.6" />
    <path d="M274,258 C302,244 342,244 376,258" stroke="#3A7BD5" stroke-width="6" stroke-linecap="round" opacity="0.6" />

    <!-- Center Spine Glowing Seam -->
    <path d="M256,152 L256,334" stroke="#00D2FF" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)" />
  </g>

  <!-- Universal Magic AI Sparkle (Top Right) -->
  <g transform="translate(370, 110)">
    <path d="M0,-28 Q0,0 28,0 Q0,0 0,28 Q0,0 -28,0 Q0,0 0,-28 Z" fill="#00D2FF" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
  </g>

  <!-- Small secondary sparkle -->
  <g transform="translate(130, 120)">
    <path d="M0,-14 Q0,0 14,0 Q0,0 0,14 Q0,0 -14,0 Q0,0 0,-14 Z" fill="#FFFFFF" opacity="0.85" />
  </g>
</svg>
